name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          echo "<html></html>" > www/index.html
          echo '{"appId":"com.example.blockbenchmobile","appName":"Blockbench Mobile","webDir":"www","server":{"url":"https://web.blockbench.net"}}' > capacitor.config.json
          npx cap add android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-mobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
