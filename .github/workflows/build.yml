name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build Blockbench web version
        run: |
          git clone --depth 1 https://github.com/JannisX11/blockbench.git blockbench-src
          cd blockbench-src
          npm install --ignore-scripts
          npm run build-web
      - name: Create Capacitor project
        run: |
          mkdir www
          rsync -a --exclude .git --exclude node_modules --exclude dist-electron blockbench-src/ www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"io.github.glauvermax_dotcom.blockbenchoffline","appName":"Blockbench Offline","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Add file saving support
        run: |
          cp android-save.js www/android-save.js
          sed -i -E 's|<head( [^>]*)?>|&<script src="android-save.js"></script>|' www/index.html
          grep -q android-save.js www/index.html || { echo "Could not add script to index.html"; exit 1; }
          MAIN=$(find android/app/src -name 'MainActivity.*' | head -1)
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 -oP '(?<=^package )[^;[:space:]]+' "$MAIN")
          rm "$MAIN"
          cat > "$DIR/MainActivity.java" <<JAVAEOF
          package $PKG;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF
          cat > "$DIR/SaveFilePlugin.java" <<JAVAEOF
          package $PKG;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveFile")
          public class SaveFilePlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {
                  String name = call.getString("name", "file");
                  String data = call.getString("data");
                  if (data == null) {
                      call.reject("No data");
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/octet-stream");
                  intent.putExtra(Intent.EXTRA_TITLE, name);
                  startActivityForResult(call, intent, "saveResult");
              }

              @ActivityCallback
              private void saveResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      JSObject cancelled = new JSObject();
                      cancelled.put("saved", false);
                      call.resolve(cancelled);
                      return;
                  }
                  Uri uri = result.getData().getData();
                  try {
                      byte[] bytes = Base64.decode(call.getString("data"), Base64.DEFAULT);
                      OutputStream os = getContext().getContentResolver().openOutputStream(uri);
                      if (os == null) {
                          call.reject("Could not open file");
                          return;
                      }
                      os.write(bytes);
                      os.close();
                      JSObject done = new JSObject();
                      done.put("saved", true);
                      call.resolve(done);
                  } catch (Exception e) {
                      call.reject("Save failed: " + e.getMessage());
                  }
              }
          }
          JAVAEOF
          npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Blockbench-Mobile.apk
          BB=$(git -C blockbench-src rev-parse --short HEAD)
          gh release create "build-$(date -u +%Y%m%d-%H%M)" Blockbench-Mobile.apk \
            --repo "${{ github.repository }}" \
            --title "Blockbench Offline $(date -u +%Y-%m-%d)" \
            --notes "Unofficial offline Android build of the Blockbench web app. Built from Blockbench commit $BB: https://github.com/JannisX11/blockbench/commit/$BB"
