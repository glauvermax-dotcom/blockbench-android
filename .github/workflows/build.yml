name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Blockbench web version
        run: |
          git clone --depth 1 https://github.com/JannisX11/blockbench.git blockbench-src
          cd blockbench-src
          npm install --ignore-scripts
          npm run build-web
      - name: Create Capacitor project
        run: |
          mkdir www
          rsync -a --exclude .git --exclude node_modules --exclude dist-electron blockbench-src/ www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.example.blockbenchmobile","appName":"Blockbench Mobile","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-mobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Blockbench-Mobile.apk
          BB=$(git -C blockbench-src rev-parse --short HEAD)
          gh release create "build-$(date -u +%Y%m%d-%H%M)" Blockbench-Mobile.apk \
            --repo "${{ github.repository }}" \
            --title "Blockbench Mobile $(date -u +%Y-%m-%d)" \
            --notes "Unofficial offline Android build of the Blockbench web app. Built from Blockbench commit $BB: https://github.com/JannisX11/blockbench/commit/$BB"
